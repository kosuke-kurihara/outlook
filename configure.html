document.getElementById('download').onclick=()=>{try{
const raw=document.getElementById('url').value.trim();const u=new URL(raw);
if(u.protocol!=='https:'||u.username||u.password||u.search||u.hash)throw Error('認証情報・クエリ・フラグメントを含まないHTTPS URLを入力してください。');
const base=u.href.endsWith('/')?u.href.slice(0,-1):u.href;const mode=document.getElementById('mode').value;
const esc=s=>s.replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;').replaceAll('>','&gt;');
let xml=templates[mode].replaceAll('{{BASE_URL}}',esc(base));
xml=xml.replace('<AppDomain>'+esc(base)+'</AppDomain>','<AppDomain>'+esc(u.origin)+'</AppDomain>');
const blob=URL.createObjectURL(new Blob([xml],{type:'application/xml'}));const a=document.createElement('a');a.href=blob;a.download='manifest-'+mode+'.xml';a.click();setTimeout(()=>URL.revokeObjectURL(blob),1000);document.getElementById('status').textContent='マニフェストを保存しました。';
}catch(e){document.getElementById('status').textContent=e.message;}};
